<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Media Portfolio</title>
  <style>
    :root {
      --bg-light: #f99;
      --text-light: #000;
      --bg-dark: #000;
      --text-dark: #fee;
    }

    * {
      box-sizing: border-box;
      transition: background-color 0.3s, color 0.3s;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: var(--bg-light);
      color: var(--text-light);
    }

    body.dark {
      background-color: var(--bg-dark);
      color: var(--text-dark);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #eee;
    }

    header h1 {
      margin: 0;
    }

    .toggle-theme {
      cursor: pointer;
      padding: 0.5rem 1rem;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 5px;
    }

    nav {
      display: flex;
      gap: 1rem;
      justify-content: center;
      background: #ddd;
      padding: 0.5rem;
      flex-wrap: wrap;
    }

    nav button {
      background: #ccc;
      border: none;
      font-size: 1rem;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
    }

    nav button:hover {
      background: #bbb;
    }

    nav button.active-tab {
      background: #999;
      color: white;
    }

    section {
      padding: 1rem;
      display: none;
    }

    section.active {
      display: block;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 1rem;
      overflow-y: auto;
      max-height: 60vh;
      padding-right: 5px;
    }

    .grid img,
    .grid video {
      width: 100%;
      height: auto;
      border-radius: 10px;
    }

    footer {
      margin-top: 2rem;
      padding: 1rem;
      background: #eee;
      text-align: center;
    }

    .socials button {
      margin: 0.5rem;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      nav {
        flex-direction: column;
        align-items: center;
      }

      .grid {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Deba's photography</h1>
    <button class="toggle-theme">Toggle Theme</button>
  </header>

  <div style="text-align:center; padding: 1rem;">
    <h2>Welcome to my media portfolio!</h2>
  </div>

  <nav>
    <button onclick="showSection('photos', this)" class="active-tab">Photos</button>
    <button onclick="showSection('videos', this)">Videos</button>
    <button onclick="showSection('about', this)">About</button>
  </nav>

  <section id="photos" class="active">
    <h3>Photo Gallery</h3>
    <div class="grid">
      <img src="https://via.placeholder.com/150" alt="Photo 1">
      <img src="https://via.placeholder.com/150" alt="Photo 2">
      <img src="https://via.placeholder.com/150" alt="Photo 3">
      <img src="https://via.placeholder.com/150" alt="Photo 4">
    </div>
  </section>

  <section id="videos">
    <h3>Video Gallery</h3>
    <div class="grid">
      <video controls>
        <source src="video1.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
      <video controls>
        <source src="video2.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>
  </section>

  <section id="about">
    <h3>About & Booking</h3>
    <p>Contact us for bookings and inquiries.</p>
    <p>Email: contact@example.com</p>
    <p>Phone: +91-XXXXXXXXXX</p>
  </section>

  <footer>
    <div class="socials">
      <button onclick="openApp('https://wa.me/918927214652')">WhatsApp</button>
      <button onclick="openApp('https://www.instagram.com')">Instagram</button>
      <button onclick="openApp('https://www.facebook.com')">Facebook</button>
    </div>
    <p>&copy; 2025 My Website</p>
  </footer>

  <script>
    const sections = document.querySelectorAll('section');

    function showSection(id, btn) {
      sections.forEach(sec => sec.classList.remove('active'));
      document.getElementById(id).classList.add('active');

      const navButtons = document.querySelectorAll('nav button');
      navButtons.forEach(b => b.classList.remove('active-tab'));
      if (btn) btn.classList.add('active-tab');
    }

    document.querySelector('.toggle-theme').addEventListener('click', () => {
      document.body.classList.toggle('dark');
    });

    function openApp(url) {
      window.open(url, '_blank');
    }
  </script>
</body>
    </html>
